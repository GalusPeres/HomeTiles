site_name: HomeTiles
site_description: Home Assistant touch dashboards for ESP32-P4 and ESP32-S3 displays. Install HomeTiles, connect the Bridge, and configure your tiles.
site_url: https://galusperes.github.io/
repo_url: https://github.com/GalusPeres/HomeTiles
repo_name: GalusPeres/HomeTiles

extra:
  sitemap_aliases:
    - https://galusperes.github.io/HomeTiles/

theme:
  name: material
  custom_dir: overrides
  font: false
  favicon: images/favicon.svg
  logo: images/logo.svg
  palette:
    - scheme: slate
      primary: black
      accent: teal
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
  icon:
    repo: fontawesome/brands/github

nav:
  - Overview: index.md
  - Installation:
      - Flash firmware: installer.md
      - Home Assistant: home-assistant-setup.md
      - Bridge Integration: bridge.md
  - Dashboard:
      - Web Admin Panel: web-admin.md
      - On-Device UI: device-ui.md
      - Tile Types: tiles.md
      - Screensaver: screensaver.md
      - Local Hardware I/O: hardware-io.md
  - Help:
      - Firmware Updates: updating.md
      - Troubleshooting: faq.md
      - Device logs: device-logs.md
      - Release Notes: releases/index.md

extra_css:
  - stylesheets/extra.css?v=installer-ui-5
  - stylesheets/readability.css?v=20260906-docs20

  - stylesheets/device-status.css?v=2
  - stylesheets/device-logs.css?v=device-logs-2
  - stylesheets/serial-status.css?v=serial-navigation-3

extra_javascript:
  - path: assets/javascripts/docs-session.mjs?v=serial-navigation-4
    type: module

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: false
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
